services:
  slave:
    build: .
    image: innopool-slave:local
    # Built from this repo. Do not pull innopool-slave from Docker Hub.
    pull_policy: build
    ports:
      - "${DASHBOARD_HOST_PORT:-8787}:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
      # Audit copies of the leaves the master spot-checks. Kept AUDIT_TTL
      # seconds (default 30 days) — your own evidence if TIG disputes a batch.
      - ${AUDIT_DIR:-./data/audit}:/app/audit
    environment:
      - VERBOSE=${VERBOSE:-}
      - SLAVE_NAME=${SLAVE_NAME}
      - MASTER_PORT=${MASTER_PORT}
      - MASTER_IP=${MASTER_IP}
      - TTL=${TTL}
      - AUDIT_TTL=${AUDIT_TTL:-2592000}
      - NUM_WORKERS=${NUM_WORKERS}
      - DASHBOARD_PORT=8787
      - DASHBOARD_HOST=0.0.0.0
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  # CPU challenge runtimes (pool-cpu-*)
  satisfiability:
    image: ghcr.io/tig-foundation/tig-monorepo/satisfiability/runtime:${TIG_VERSION}
    container_name: satisfiability
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  vehicle_routing:
    image: ghcr.io/tig-foundation/tig-monorepo/vehicle_routing/runtime:${TIG_VERSION}
    container_name: vehicle_routing
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  knapsack:
    image: ghcr.io/tig-foundation/tig-monorepo/knapsack/runtime:${TIG_VERSION}
    container_name: knapsack
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  job_scheduling:
    image: ghcr.io/tig-foundation/tig-monorepo/job_scheduling/runtime:${TIG_VERSION}
    container_name: job_scheduling
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  energy_arbitrage:
    image: ghcr.io/tig-foundation/tig-monorepo/energy_arbitrage/runtime:${TIG_VERSION}
    container_name: energy_arbitrage
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  # GPU challenge runtimes (pool-gpu-*) — require NVIDIA Container Toolkit.
  # runtime: nvidia alone does not inject a device on toolkit 1.17+;
  # --gpus all / NVIDIA_VISIBLE_DEVICES is what makes CUDA see the card.
  vector_search:
    image: ghcr.io/tig-foundation/tig-monorepo/vector_search/runtime:${TIG_VERSION}
    container_name: vector_search
    profiles: ["gpu"]
    runtime: nvidia
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  hypergraph:
    image: ghcr.io/tig-foundation/tig-monorepo/hypergraph/runtime:${TIG_VERSION}
    container_name: hypergraph
    profiles: ["gpu"]
    runtime: nvidia
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"

  neuralnet_optimizer:
    image: ghcr.io/tig-foundation/tig-monorepo/neuralnet_optimizer/runtime:${TIG_VERSION}
    container_name: neuralnet_optimizer
    profiles: ["gpu"]
    runtime: nvidia
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${ALGORITHMS_DIR}:/app/algorithms
      - ${RESULTS_DIR}:/app/results
    command: ["sleep", "infinity"]
    # Do not auto-start on host reboot. A crash can leave a torn overlay;
    # install.sh systemd pulls images and force-recreates before work starts.
    restart: "no"
